# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
        exclude: ^\.clang-(format|tidy)$
      - id: check-added-large-files

  # Config file: .codespellrc
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        files: ^.*\.(cmake|cpp|cppm|hpp|txt|md|mds|json|js|in|yaml|yml|py|toml)$
        args: ["--write", "--ignore-words", ".codespellignore" ]

  # Clang-format for C++
  # This brings in a portable version of clang-format.
  # See also: https://github.com/ssciwr/clang-format-wheel
  # Config file: .clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: ce4bd7270237e95464b37d808b942f02785192c4  # frozen: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c, json, javascript]
        exclude: docs/TODO.json

  # CMake linting and formatting
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 28010ddd6016e1a0f7bd232acb6536ef996ae897  # frozen: 0.29.2
    hooks:
      - id: gersemi
        name: CMake linting

  # Markdown linting
  # Config file: .markdownlint.yaml
  # Commented out to disable this by default. Uncomment to enable markdown linting.
  # - repo: https://github.com/igorshubovych/markdownlint-cli
  #   rev: v0.46.0
  #   hooks:
  #     - id: markdownlint

  # Config file: pyproject.toml
  # first Python sort imports
  - repo: https://github.com/pycqa/isort
    rev: eb62da318ea543b82340f3d0a52bc0509c7e626e  # frozen: 10.0.0b3
    hooks:
      - id: isort

  # Config file: pyproject.toml
  # second Python code formatting
  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc  # frozen: 26.10.1
    hooks:
      - id: black

  # Beman Standard checking via beman-tidy
  - repo: https://github.com/bemanproject/beman-tidy
    rev: 9d6c974eba684ea4d3541d943cbaa6ce8a7a5bc9  # frozen: v0.5.4
    hooks:
      - id: beman-tidy
        args: [".", "--verbose", "--require-all"]

exclude: 'infra/'
